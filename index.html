<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0F1513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Procraft Tools">
<title>Procraft Tools</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#0F1513;color:#E8EEEA;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#boot{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
#boot img{width:88px;height:88px;border-radius:20px;display:block;margin:0 auto 18px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:#F5CF66;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
p{margin:0;color:#A3B0A9}
button{margin-top:16px;border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;background:#E5B341;color:#1A1608}
</style>
</head>
<body>
<div id="boot"><div><img src="icon-192.png" alt=""><div class="spin" id="spin"></div><p id="msg">Loading Procraft Tools…</p></div></div>
<script>
/* Thin shell: the app's screens are served by Google Apps Script, so updates
   there go live without changing this file. The last version is kept on the
   phone so the app opens instantly next time. */
(function(){
  var API = "https://script.google.com/macros/s/AKfycbzbMQ0tmfzuw0_u4SEySLw9qePSJIvmqzP_ZUGufnQuZ-kzYLB7Yw6logb4WQ-oYcNg/exec";
  var KEY = "pt.appHtml", done = false;
  var msg = document.getElementById("msg");
  function show(html){ done = true; document.open(); document.write(html); document.close(); }
  function fail(why){ if (done) return; done = true;
    document.getElementById("spin").style.display = "none";
    msg.innerHTML = "Can\u2019t reach the server.<br>Check your signal and try again.<br><small style='opacity:.6'>" + String(why || "").replace(/[<>&]/g, "") + "</small>";
    var b = document.createElement("button"); b.textContent = "Try again"; b.onclick = function(){ location.reload(); };
    msg.parentNode.appendChild(b); }
  var cached = null; try { cached = localStorage.getItem(KEY); } catch (e) {}
  var slow = setTimeout(function(){ if (!done) msg.textContent = "Still loading\u2026 the first open can take a few seconds."; }, 6000);
  var stop = setTimeout(function(){ fail("Timed out"); }, 30000);
  var req = fetch(API + "?page=app", { cache: "no-store", redirect: "follow" })
    .then(function(r){ if (!r.ok) throw new Error("Server " + r.status); return r.text(); })
    .then(function(html){ if (html.indexOf("Procraft") < 0) throw new Error("Unexpected reply"); try { localStorage.setItem(KEY, html); } catch (e) {} return html; });
  if (cached) { show(cached); req.catch(function(){}); }
  else { req.then(function(h){ clearTimeout(slow); clearTimeout(stop); show(h); }).catch(function(e){ clearTimeout(slow); clearTimeout(stop); fail(e && e.message); }); }
})();
</script>
</body>
</html>
