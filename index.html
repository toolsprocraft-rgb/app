<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Procraft Tools">
<title>Procraft Tools</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#0F1513; --panel:#171F1C; --panel-2:#1E2825; --ink:#E8EEEA; --muted:#A3B0A9; --faint:#73817A; --line:#2A3531;
  --gold1:#F5CF66; --gold2:#D4972A; --green1:#5BD3A8; --green2:#1F8A66;
  --out:#F0975E; --out-bg:#3A2416; --ok:#5CC08B; --ok-bg:#16301F; --bad:#E8767B; --bad-bg:#3A1D1F; --warn:#E3B354; --warn-bg:#352A14;
  --focus:#7AA7F5; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
header.bar{position:sticky;top:0;z-index:10;background:rgba(15,21,19,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.bar .in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:60px}
.mark{width:30px;height:30px;flex:none}
header h1{font-size:17px;margin:0;font-weight:700;flex:1}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.back{appearance:none;border:0;background:none;color:var(--muted);font-weight:600;padding:10px 8px 10px 0;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:15px}
.back svg{width:18px;height:18px}
h2{font-size:26px;margin:4px 0 4px;letter-spacing:-.015em}
.sub{color:var(--muted);margin:0 0 16px}
.label{font-size:13.5px;font-weight:600;color:var(--muted);margin:18px 0 8px}

/* big actions */
.tile{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;border-radius:22px;padding:20px;min-height:116px;background:radial-gradient(120% 100% at 100% 0%,var(--tint),transparent 60%),var(--panel);border:1px solid var(--line);margin-bottom:12px;--a1:var(--gold1);--a2:var(--gold2);--tint:rgba(240,190,80,.10)}
.tile.ret{--a1:var(--green1);--a2:var(--green2);--tint:rgba(80,200,160,.10)}
.tile:active{transform:scale(.98)}
.badge-ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;flex:none;background:linear-gradient(150deg,var(--a1),var(--a2));box-shadow:0 8px 22px -8px var(--a2),inset 0 1px 0 rgba(255,255,255,.35);color:#14110A}
.tile.ret .badge-ic{color:#06231A}
.badge-ic svg{width:30px;height:30px}
.tile b{display:block;font-size:24px;letter-spacing:-.01em}
.tile.hub{min-height:150px}
.tile.hub b{font-size:28px}
.tile .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tile .meta span{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.tile .meta span.hot{color:var(--a1)}
.tile small{display:block;color:var(--muted);font-size:14.5px;margin-top:2px}
.tile .chev{margin-left:auto;color:var(--faint)}
.tile .chev svg{width:22px;height:22px}

/* lists */
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;min-height:64px}
.item:first-child{border-top:0}
.item:disabled{cursor:default;opacity:.55}
.item .t{flex:1;min-width:0}
.item .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;background:var(--gold1);color:#1A1608;border-radius:4px;padding:2px 7px;font-weight:700;font-stretch:72%;font-size:14.5px;letter-spacing:.02em;white-space:nowrap;flex:none;box-shadow:inset 3px 0 0 var(--gold2)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.item[aria-pressed="true"]{background:rgba(245,207,102,.07)}
.item[aria-pressed="true"] .check{background:var(--gold1);border-color:var(--gold1);color:#1A1608}
.check svg{width:16px;height:16px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.over{background:var(--bad-bg);color:var(--bad)} .pill.out{background:var(--out-bg);color:var(--out)} .pill.rep{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}

.search{display:flex;gap:8px;margin-bottom:12px}
.inp{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:52px;font-size:17px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.scanbtn{appearance:none;border:0;border-radius:14px;min-height:52px;padding:0 16px;background:linear-gradient(150deg,var(--gold1),var(--gold2));color:#1A1608;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;flex:none}
.scanbtn.g{background:linear-gradient(150deg,var(--green1),var(--green2));color:#06231A}
.scanbtn svg{width:20px;height:20px}

.btn{appearance:none;border:0;border-radius:16px;min-height:58px;width:100%;font-size:18px;font-weight:700;cursor:pointer;background:linear-gradient(150deg,var(--gold1),var(--gold2));color:#1A1608}
.btn.g{background:linear-gradient(150deg,var(--green1),var(--green2));color:#06231A}
.btn.plain{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:16px;min-height:50px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,21,19,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:560px;margin:0 auto;display:grid;gap:10px}

/* return form */
.toolhead{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:6px}
.toolhead .n{font-weight:700;font-size:18px}
.photo{display:grid;place-items:center;gap:6px;width:100%;min-height:150px;border:2px dashed var(--line);border-radius:16px;background:var(--panel);color:var(--muted);cursor:pointer;font-weight:600;overflow:hidden;padding:0}
.photo svg{width:34px;height:34px}
.photo img{width:100%;max-height:300px;object-fit:cover;display:block}
.photo.has{border-style:solid;border-color:var(--green2)}
.conds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cond{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:14px;min-height:56px;font-weight:700;cursor:pointer;font-size:15px}
.cond[aria-pressed="true"][data-c="Good"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cond[aria-pressed="true"][data-c="Damaged"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cond[aria-pressed="true"][data-c="Missing parts"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
textarea.inp{padding:12px 14px;min-height:80px;resize:vertical}
.sig{position:relative;background:#F4F6F4;border-radius:16px;overflow:hidden;touch-action:none}
.sig canvas{display:block;width:100%;height:170px}
.sig .hint{position:absolute;left:16px;bottom:12px;color:#7B8781;font-size:13.5px;pointer-events:none}
.sig .line{position:absolute;left:16px;right:16px;bottom:36px;border-top:1.5px dashed #B9C2BD;pointer-events:none}
.sig .clr{position:absolute;right:10px;top:10px;appearance:none;border:0;background:#E1E6E3;color:#2A3531;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer}

/* activity */
.log .item{cursor:default;align-items:flex-start}
.log .n{white-space:normal}
.kind{font-size:12px;font-weight:700;padding:4px 8px;border-radius:7px;flex:none;min-width:58px;text-align:center;margin-top:2px}
.kind.o{background:var(--out-bg);color:var(--out)} .kind.i{background:var(--ok-bg);color:var(--ok)} .kind.r{background:var(--warn-bg);color:var(--warn)}
.when{font-size:12.5px;color:var(--faint);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* names */
.logo{display:block;width:min(250px,72%);height:auto;margin:10px auto 22px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.name{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:14px;min-height:56px;font-weight:600;cursor:pointer;padding:6px 10px}
.pin{letter-spacing:.5em;text-align:center;font-size:28px;font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:14px;font-weight:600;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.bad{background:var(--bad);color:#2A0B0D}
.busy{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.6);display:grid;place-items:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold1);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy p{margin:14px 0 0;color:var(--ink);font-weight:600;text-align:center}
#reader{position:absolute;left:-9999px;top:0;width:320px;height:320px;overflow:hidden}
</style>
</head>

const S={pin:ls.get("pt.pin",""),me:ls.get("pt.me",""),data:null,screen:"hub",sel:new Set(),job:ls.get("pt.job",""),q:"",ret:null,logf:"all"};

/* ---------- server ---------- */
const API="https://script.google.com/macros/s/AKfycbzbMQ0tmfzuw0_u4SEySLw9qePSJIvmqzP_ZUGufnQuZ-kzYLB7Yw6logb4WQ-oYcNg/exec";
function call(fn){ const args=[].slice.call(arguments,1);
  if(window.google&&google.script&&google.script.run) return new Promise((res,rej)=>{ google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args); });
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args})})
    .then(r=>{ if(!r.ok) throw new Error("Server error "+r.status); return r.json(); })
    .then(j=>{ if(!j.ok) throw new Error(j.error||"Something went wrong"); return j.result; })
    .catch(e=>{ throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message)?"No connection — check signal and try again":e.message); }); }
function busy(on,txt){ $("#busy").hidden=!on; if(txt) $("#busyTxt").textContent=txt; }
let tT; function toast(m,bad){ const t=$("#toast"); t.textContent=m; t.className="toast"+(bad?" bad":""); t.hidden=false; clearTimeout(tT); tT=setTimeout(()=>t.hidden=true,3600); }
function errMsg(e){ const m=(e&&e.message)||String(e); if(/PIN/.test(m)) return "PIN"; return m.replace(/^Error:\s*/,""); }
async function load(quiet){
  if(!quiet) busy(true,"Loading tools…");
  try{ S.data=await call("getData",S.pin); busy(false); render(); }
  catch(e){ busy(false); if(errMsg(e)==="PIN"){ ls.del("pt.pin"); S.pin=""; go("pin"); toast("That PIN didn’t work — ask the office for the current one.",true); } else { toast("Couldn’t load: "+errMsg(e),true); render(); } }
}

/* ---------- helpers ---------- */
const tools=()=>S.data?S.data.tools:[];
const siteTools=()=>tools().filter(t=>t.status!=="Office");
const daysOut=t=>t.outSince?Math.floor((Date.now()-new Date(t.outSince))/864e5):0;
const isOver=t=>t.status==="Out"&&daysOut(t)>=(S.data?S.data.overdueDays:7);
const first=n=>String(n||"").split(" ")[0];
const norm=s=>String(s||"").toLowerCase();
function match(t,q){ if(!q) return true; const h=norm([t.tag,t.name,t.serial,t.with].join(" ")); return norm(q).split(/\s+/).every(w=>h.includes(w)); }
function findTag(raw){ const u=String(raw||"").trim().toUpperCase().replace(/^['"]+|['"]+$/g,""); const m=u.match(/^(TOOL|EQUIP)[\s\-_]*0*(\d{1,4})$/); const tag=m?`${m[1]}-${m[2].padStart(3,"0")}`:u; return tools().find(t=>t.tag===tag)||tools().find(t=>t.serial&&t.serial.toUpperCase()===u); }
function fmtWhen(s){ const d=new Date(s); if(isNaN(d)) return ""; const t=new Date(); const sameDay=d.toDateString()===t.toDateString(); const y=new Date(t); y.setDate(t.getDate()-1);
  const time=d.toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"}); if(sameDay) return "Today "+time; if(d.toDateString()===y.toDateString()) return "Yesterday "+time; return d.toLocaleDateString("en-NZ",{day:"numeric",month:"short"})+" "+time; }
function statusPill(t){ if(t.status==="Needs repair") return `<span class="pill rep">Needs repair</span>`; if(t.status==="Out") return isOver(t)?`<span class="pill over">${daysOut(t)} days</span>`:`<span class="pill out">Out</span>`; if(t.status==="Assigned") return `<span class="pill out">Assigned</span>`; return ""; }

/* ---------- navigation ---------- */
function go(s){ S.screen=s; render(); window.scrollTo(0,0); }
function head(title,back){ return `${back?`<button class="back" data-go="${back}">${I.back}Back</button>`:""}<h2>${esc(title)}</h2>`; }
function render(){
  $("#dock").innerHTML="";
  if(!S.pin) return renderPin();
  if(!S.data) { $("#app").innerHTML=`<div class="empty">Loading…</div>`; return; }
  if(!S.me || !S.data.staff.includes(S.me) && S.screen!=="name") return renderName();
  ({hub:renderHub,home:renderHome,take:renderTake,retpick:renderRetPick,retform:renderRetForm,activity:renderActivity,name:renderName,pin:renderPin}[S.screen]||renderHome)();
}

/* PIN */
function renderPin(){
  $("#app").innerHTML=`${LOGO?`<img class="logo" src="${LOGO}" alt="Procraft Construction">`:""}<h2>Welcome</h2><p class="sub">Enter the Procraft tools PIN. You only do this once on this phone.</p>
    <form id="pinF"><label class="label" for="pinIn">PIN</label><input class="inp pin" id="pinIn" inputmode="numeric" autocomplete="off" maxlength="8" autofocus>
    <div style="height:14px"></div><button class="btn" type="submit">Continue</button></form>`;
  $("#pinF").onsubmit=e=>{ e.preventDefault(); const v=$("#pinIn").value.trim(); if(!v) return; S.pin=v; ls.set("pt.pin",v); S.screen="hub"; load(); };
}
/* Name */
function renderName(){
  const st=S.data.staff;
  $("#app").innerHTML=`${S.me&&st.includes(S.me)?`<button class="back" data-go="hub">${I.back}Back</button>`:""}<h2>Who are you?</h2><p class="sub">Tap your name. This phone will remember it.</p>
    <div class="names">${st.map(n=>`<button class="name" data-name="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <p class="sub" style="margin-top:16px;font-size:14px">Not on the list? Ask the office to add you.</p>`;
}
/* Home */
function renderHome(){
  const mine=siteTools().filter(t=>(t.status==="Out")&&t.with===S.me);
  const over=mine.filter(isOver).length;
  $("#app").innerHTML=`${head("Tools","hub")}<p class="sub">Check tools out and back in.</p>
    <button class="tile" data-go="take"><span class="badge-ic">${I.wrench}</span><span><b>Take a tool</b><small>Scan or pick, choose the job</small></span><span class="chev">${I.chev}</span></button>
    <button class="tile ret" data-go="retpick"><span class="badge-ic">${I.ret}</span><span><b>Return a tool</b><small>Photo, condition, sign</small></span><span class="chev">${I.chev}</span></button>
    <p class="label">My tools${mine.length?` (${mine.length})`:""}${over?` · <span style="color:var(--bad)">${over} overdue</span>`:""}</p>
    <div class="list">${mine.length?mine.map(t=>`<button class="item" data-ret="${esc(t.tag)}"><span class="tag">${esc(t.tag)}</span><span class="t"><div class="n">${esc(t.name)}</div><div class="s">${esc(t.job||"No job")} · since ${esc(fmtWhen(t.outSince))}</div></span>${statusPill(t)}<span class="chev" style="color:var(--faint)">${I.chev}</span></button>`).join(""):`<div class="empty">You don’t have any tools out.</div>`}</div>
    <p class="label">Activity</p>
    <button class="tile" data-go="activity" style="min-height:76px;--a1:#8FA39A;--a2:#4E5F58;--tint:transparent"><span class="badge-ic" style="width:44px;height:44px;border-radius:13px">${I.log}</span><span><b style="font-size:18px">Recent activity</b><small>Who took and returned what</small></span><span class="chev">${I.chev}</span></button>`;
}
/* Hub: Tools and Stock */
function renderHub(){
  const out=siteTools().filter(t=>t.status==="Out"), mine=out.filter(t=>t.with===S.me);
  $("#app").innerHTML=`${LOGO?`<img class="logo" src="${LOGO}" alt="Procraft Construction">`:""}<p class="sub" style="margin:4px 0 2px">Kia ora</p>
    <h2 style="margin-bottom:16px">${esc(first(S.me))} <button class="back" data-go="name" style="display:inline-flex;font-size:14px;padding:0 0 0 6px;vertical-align:middle">Not you?</button></h2>
    <button class="tile hub" data-go="home"><span class="badge-ic">${I.wrench}</span><span><b>Tools</b><small>Take and return tools</small><span class="meta">${mine.length?`<span class="hot">${mine.length} with you</span>`:""}<span>${out.length} out</span></span></span><span class="chev">${I.chev}</span></button>
    <button class="tile ret hub" data-soon="stock"><span class="badge-ic">${I.box}</span><span><b>Stock</b><small>Issue, receive and count</small><span class="meta"><span>Coming soon</span></span></span><span class="chev">${I.chev}</span></button>`;
}
/* Take */
function renderTake(){
  const q=S.q;
  const list=siteTools().filter(t=>match(t,q)).sort((a,b)=>{ const r=x=>x.status==="In"?0:x.status==="Out"?1:2; return r(a)-r(b)||a.tag.localeCompare(b.tag,undefined,{numeric:true}); });
  const shown=q?list:list.filter(t=>t.status==="In"||S.sel.has(t.tag));
  $("#app").innerHTML=`${head("Take a tool","home")}<p class="sub">Scan the label or tap the tools you’re taking.</p>
    <div class="search"><input class="inp" id="q" type="search" placeholder="Search tag or name" value="${esc(q)}" autocomplete="off"><button class="scanbtn" data-scan="take">${I.scan}Scan</button></div>
    ${!q?`<p class="label" style="margin-top:4px">In the yard (${shown.length})</p>`:""}
    <div class="list">${shown.length?shown.slice(0,120).map(t=>{ const blocked=t.status==="Needs repair"||t.status==="Assigned"; const sel=S.sel.has(t.tag);
      return `<button class="item" data-pick="${esc(t.tag)}" aria-pressed="${sel}" ${blocked?"disabled":""}><span class="check">${sel?I.tick:""}</span><span class="tag">${esc(t.tag)}</span><span class="t"><div class="n">${esc(t.name)}</div>${t.status==="Out"?`<div class="s">With ${esc(t.with)}</div>`:t.status==="Assigned"?`<div class="s">Assigned to ${esc(t.with)}</div>`:""}</span>${statusPill(t)}</button>`; }).join(""):`<div class="empty">No tools match “${esc(q)}”.</div>`}</div>`;
  const jobs=S.data.jobs;
  $("#dock").innerHTML=`<div class="dock"><div class="in"><select class="inp" id="job" aria-label="Job"><option value="">Which job?</option>${jobs.map(j=>`<option ${j===S.job?"selected":""}>${esc(j)}</option>`).join("")}</select>
    <button class="btn" id="doTake" ${S.sel.size?"":"disabled"}>${S.sel.size?`Take ${S.sel.size} tool${S.sel.size>1?"s":""}`:"Select tools"}</button></div></div>`;
  const qi=$("#q"); qi.oninput=()=>{ S.q=qi.value; const pos=qi.selectionStart; renderTake(); const n=$("#q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} };
  $("#job").onchange=e=>{ S.job=e.target.value; ls.set("pt.job",S.job); };
}
async function doTake(){
  const job=$("#job").value; if(!job){ toast("Pick the job first.",true); $("#job").focus(); return; }
  S.job=job; ls.set("pt.job",job);
  const tags=[...S.sel]; busy(true,"Saving…");
  try{ const r=await call("checkout",S.pin,{person:S.me,job,tags}); S.data=r.data; busy(false); S.sel.clear(); S.q="";
    toast(`Done — ${r.done.length} tool${r.done.length!==1?"s":""} taken to ${job}`+(r.skipped.length?`. Not taken: ${r.skipped.join(", ")}`:""),!!r.skipped.length); go("home"); }
  catch(e){ busy(false); toast("Didn’t save: "+errMsg(e)+". Try again.",true); }
}
/* Return – pick */
function renderRetPick(){
  const q=S.q; const all=siteTools().filter(t=>t.status==="Out"&&match(t,q));
  const mine=all.filter(t=>t.with===S.me), others=all.filter(t=>t.with!==S.me);
  const row=t=>`<button class="item" data-ret="${esc(t.tag)}"><span class="tag">${esc(t.tag)}</span><span class="t"><div class="n">${esc(t.name)}</div><div class="s">${esc(t.with)}${t.job?" · "+esc(t.job):""}</div></span>${statusPill(t)}</button>`;
  $("#app").innerHTML=`${head("Return a tool","home")}<p class="sub">Scan the label, or tap the tool.</p>
    <div class="search"><input class="inp" id="q" type="search" placeholder="Search tag or name" value="${esc(q)}" autocomplete="off"><button class="scanbtn g" data-scan="ret">${I.scan}Scan</button></div>
    <p class="label">Mine (${mine.length})</p><div class="list">${mine.length?mine.map(row).join(""):`<div class="empty">None</div>`}</div>
    <p class="label">Out with others (${others.length})</p><div class="list">${others.length?others.map(row).join(""):`<div class="empty">None</div>`}</div>`;
  const qi=$("#q"); qi.oninput=()=>{ S.q=qi.value; const pos=qi.selectionStart; renderRetPick(); const n=$("#q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} };
}
/* Return – form */
let sigPad=null;
function startReturn(tag){
  const t=tools().find(x=>x.tag===tag); if(!t){ toast("That tool isn’t in the register.",true); return; }
  S.ret={tag,photo:"",cond:"",note:""}; S.q=""; go("retform");
}
function renderRetForm(){
  const r=S.ret; const t=tools().find(x=>x.tag===r.tag); if(!t) return go("home");
  $("#app").innerHTML=`${head("Return tool","retpick")}
    <div class="toolhead"><span class="tag">${esc(t.tag)}</span><div style="min-width:0"><div class="n">${esc(t.name)}</div><div class="sub" style="margin:0;font-size:14px">${t.status==="Out"?`With ${esc(t.with)}${t.job?" · "+esc(t.job):""}`:"Not checked out"}</div></div></div>
    <p class="label">1. Photo of the tool</p>
    <button class="photo ${r.photo?"has":""}" id="takePhoto">${r.photo?`<img src="${r.photo}" alt="Photo of ${esc(t.name)}">`:`${I.cam}<span>Take photo</span>`}</button>
    <p class="label">2. Condition</p>
    <div class="conds">${["Good","Damaged","Missing parts"].map(c=>`<button class="cond" data-c="${c}" aria-pressed="${r.cond===c}">${c}</button>`).join("")}</div>
    <div id="noteWrap" ${r.cond&&r.cond!=="Good"?"":"hidden"}><p class="label">What’s wrong?</p><textarea class="inp" id="note" placeholder="e.g. cracked guard, missing battery">${esc(r.note)}</textarea></div>
    <p class="label">3. Sign</p>
    <div class="sig"><canvas id="sig"></canvas><div class="line"></div><span class="hint">${esc(S.me)} — sign with your finger</span><button class="clr" id="sigClr" type="button">Clear</button></div>`;
  $("#dock").innerHTML=`<div class="dock"><div class="in"><button class="btn g" id="doRet">Return tool</button></div></div>`;
  sigPad=makePad($("#sig"));
  $("#note")&&($("#note").oninput=e=>{ r.note=e.target.value; });
}
function makePad(c){
  const ctx=c.getContext("2d"); let drawn=false, last=null;
  function size(){ const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.6; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111A16"; drawn=false; }
  size();
  const pt=e=>{ const r=c.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  c.addEventListener("pointerdown",e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); last=pt(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.2,0,7); ctx.fillStyle="#111A16"; ctx.fill(); drawn=true; });
  c.addEventListener("pointermove",e=>{ if(!last) return; e.preventDefault(); const p=pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; drawn=true; });
  const up=()=>{ last=null; }; c.addEventListener("pointerup",up); c.addEventListener("pointercancel",up);
  return { clear(){ ctx.clearRect(0,0,c.width,c.height); drawn=false; }, has:()=>drawn, data(){ const o=document.createElement("canvas"); o.width=c.width; o.height=c.height; const x=o.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,o.width,o.height); x.drawImage(c,0,0); return o.toDataURL("image/png"); } };
}
async function doReturn(){
  const r=S.ret;
  if(!r.photo){ toast("Take a photo of the tool first.",true); return; }
  if(!r.cond){ toast("Tap the condition.",true); return; }
  if(r.cond!=="Good" && !String(r.note||"").trim()){ toast("Say what’s wrong with it.",true); $("#note").focus(); return; }
  if(!sigPad||!sigPad.has()){ toast("Please sign.",true); return; }
  busy(true,"Uploading photo…");
  try{ const res=await call("checkin",S.pin,{person:S.me,tag:r.tag,condition:r.cond,note:r.note,photo:r.photo,signature:sigPad.data()});
    S.data=res.data; busy(false); S.ret=null; toast(r.cond==="Good"?`Returned ${r.tag} — thanks`:`Returned ${r.tag} — flagged for repair`); go("home"); }
  catch(e){ busy(false); toast("Didn’t save: "+errMsg(e)+". Try again.",true); }
}
function resizePhoto(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const max=1400, k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.72)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("Couldn’t read that photo")); }; img.src=url; }); }
/* Activity */
function renderActivity(){
  const f=S.logf; const L=S.data.log.filter(l=>f==="all"||(f==="me"&&l.person===S.me)||(f==="rep"&&(l.condition==="Damaged"||l.condition==="Missing parts")));
  $("#app").innerHTML=`${head("Recent activity","home")}
    <div class="chips">${[["all","Everyone"],["me","Just me"],["rep","Damage reports"]].map(([k,l])=>`<button class="chip" data-logf="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
    <div class="list log">${L.length?L.map(l=>{ const k=l.action==="Check out"?"o":l.action==="Check in"?"i":"r";
      return `<div class="item"><span class="kind ${k}">${l.action==="Check out"?"Out":l.action==="Check in"?"In":esc(l.action)}</span><span class="t"><div class="n"><span class="tag" style="font-size:12.5px;padding:1px 5px">${esc(l.tag)}</span> ${esc(l.tool)}</div>
      <div class="s" style="white-space:normal">${esc(l.person)}${l.job?" · "+esc(l.job):""}${l.condition&&l.condition!=="Good"?` · <span style="color:var(--bad)">${esc(l.condition)}</span>`:""}${l.photo?" · photo":""}${l.sig?" · signed":""}</div>${l.note?`<div class="s" style="white-space:normal">${esc(l.note)}</div>`:""}</span><span class="when">${esc(fmtWhen(l.at))}</span></div>`; }).join(""):`<div class="empty">Nothing yet.</div>`}</div>`;
}

/* ---------- scanning (photo of the label) ---------- */
let scanMode="take", qr=null;
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ res(im); setTimeout(()=>URL.revokeObjectURL(u),2000); }; im.onerror=()=>rej(new Error("Couldn’t open that photo")); im.src=u; }); }
function dims(im){ return {w:im.naturalWidth||im.width, h:im.naturalHeight||im.height}; }
function scaled(im,w){ const d=dims(im), k=Math.min(1,w/d.w); const c=document.createElement("canvas"); c.width=Math.round(d.w*k); c.height=Math.round(d.h*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); return c; }
function centerCrop(im,f){ const d=dims(im), cw=Math.round(d.w*f), ch=Math.round(d.h*f); const c=document.createElement("canvas"); c.width=cw; c.height=ch; c.getContext("2d").drawImage(im,Math.round((d.w-cw)/2),Math.round((d.h-ch)/2),cw,ch,0,0,cw,ch); return c; }
function blurGray(src,w,h){ const g=new Float32Array(w*h); for(let i=0;i<w*h;i++) g[i]=src[i*4]*0.299+src[i*4+1]*0.587+src[i*4+2]*0.114;
  const o=new Uint8ClampedArray(w*h*4);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let s=0,n=0; for(let dy=-1;dy<=1;dy++){ const yy=y+dy; if(yy<0||yy>=h) continue; for(let dx=-1;dx<=1;dx++){ const xx=x+dx; if(xx<0||xx>=w) continue; s+=g[yy*w+xx]; n++; } } const v=s/n, i=(y*w+x)*4; o[i]=o[i+1]=o[i+2]=v; o[i+3]=255; }
  return o; }
let scanInfo="";
async function decodeLabel(file){
  scanInfo="v3";
  const im=await loadImg(file);
  scanInfo+=` · photo ${im.naturalWidth}×${im.naturalHeight} · BD ${"BarcodeDetector" in window?"yes":"no"} · jsQR ${window.jsQR?"yes":"no"}`;
  // try the middle of the photo first at a few crops, then the whole photo
  const crops=[1,0.7,0.5];
  // 1. Phone's built-in scanner (most Android phones)
  if("BarcodeDetector" in window){ try{ const bd=new BarcodeDetector({formats:["qr_code","code_128","code_39","data_matrix"]});
    for(const w of [1000,700,1500]){ const r=await bd.detect(scaled(im,w)); if(r&&r.length) return r[0].rawValue; } }catch(e){} }
  // 2. jsQR at several sizes, plain then softened (works on iPhone too)
  if(window.jsQR){ for(const crop of crops){ const src=crop===1?im:centerCrop(im,crop); for(const w of [500,400,650,800,1000,300]){ try{ const c=scaled(src,w), ctx=c.getContext("2d"), d=ctx.getImageData(0,0,c.width,c.height).data;
    let r=jsQR(d,c.width,c.height,{inversionAttempts:"attemptBoth"}); if(r&&r.data) return r.data;
    r=jsQR(blurGray(d,c.width,c.height),c.width,c.height,{inversionAttempts:"attemptBoth"}); if(r&&r.data) return r.data; }catch(e){ scanInfo+=" · err "+(e&&e.message||e); } } } }
  // 3. Last try: html5-qrcode (also reads line barcodes)
  if(window.Html5Qrcode){ try{ qr=qr||new Html5Qrcode("reader"); const c=scaled(im,900); const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9)); return await qr.scanFile(new File([blob],"label.jpg",{type:"image/jpeg"}),false); }catch(e){} }
  return "";
}
$("#scanFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  busy(true,"Reading label…");
  let code=""; try{ code=await decodeLabel(f); }catch(err){ scanInfo+=" · "+(err&&err.message||err); }
  busy(false);
  if(!code){ toast("Couldn’t read the label. Fill the photo with the label, or type the tag number in search. ("+scanInfo+")",true); return; }
  const t=findTag(code);
  if(!t){ toast(`Label “${code}” isn’t in the register.`,true); return; }
  if(scanMode==="take"){
    if(t.status==="Needs repair"){ toast(`${t.tag} is flagged for repair — don’t use it.`,true); return; }
    if(t.status==="Office"||t.status==="Assigned"){ toast(`${t.tag} isn’t a yard tool.`,true); return; }
    S.sel.add(t.tag); toast(`Added ${t.tag} ${t.name}`); renderTake();
  } else startReturn(t.tag);
});
$("#photoFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f||!S.ret) return;
  try{ busy(true,"Preparing photo…"); S.ret.photo=await resizePhoto(f); busy(false); const keepSig=sigPad&&sigPad.has()?sigPad.data():null; renderRetForm(); if(keepSig) restoreSig(keepSig); }catch(err){ busy(false); toast(errMsg(err),true); }
});
function restoreSig(d){ const c=$("#sig"); const img=new Image(); img.onload=()=>{ const ctx=c.getContext("2d"); const dpr=window.devicePixelRatio||1; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(img,0,0,c.width,c.height); ctx.restore(); sigPad.has=()=>true; }; img.src=d; }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.go){ if(b.dataset.go==="take"||b.dataset.go==="retpick"){ S.q=""; } go(b.dataset.go); return; }
  if(b.dataset.name){ S.me=b.dataset.name; ls.set("pt.me",S.me); go("hub"); return; }
  if(b.dataset.pick){ const t=b.dataset.pick; S.sel.has(t)?S.sel.delete(t):S.sel.add(t); renderTake(); return; }
  if(b.dataset.ret){ startReturn(b.dataset.ret); return; }
  if(b.dataset.soon){ toast("Stock is coming soon. Keep doing stock the usual way for now."); return; }
  if(b.dataset.scan){ scanMode=b.dataset.scan; $("#scanFile").click(); return; }
  if(b.dataset.logf){ S.logf=b.dataset.logf; renderActivity(); return; }
  if(b.dataset.c){ const note=$("#note"); if(note) S.ret.note=note.value; S.ret.cond=b.dataset.c; document.querySelectorAll(".cond").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===S.ret.cond)); $("#noteWrap").hidden=S.ret.cond==="Good"; return; }
  if(b.id==="takePhoto"){ $("#photoFile").click(); return; }
  if(b.id==="sigClr"){ sigPad&&sigPad.clear(); return; }
  if(b.id==="doTake"){ doTake(); return; }
  if(b.id==="doRet"){ doReturn(); return; }
  if(b.id==="refresh"){ if(S.pin) load(); return; }
});

render(); if(S.pin) load();
})();
</script>
</body>
